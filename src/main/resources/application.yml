spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/billetterie?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    url: ${DB_URL:jdbc:mysql://localhost:3306/billetterie?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    user: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jackson:
    time-zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health
